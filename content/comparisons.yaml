# Comparisons with a note on what the difference teaches. CC BY 4.0.
comparisons:
- a: phenoxymethylpenicillin
  b: amoxicillin
  title: What the side chain changes
  note:
    caption: Same penam nucleus; only the acyl group on position 6 differs.
    body:
    - 'Both drugs share the fused β-lactam and thiazolidine nucleus with its position 3 carboxylate. They differ only at position
      6: a phenoxyacetyl group in penicillin V, a 2-amino-2-(4-hydroxyphenyl)acetyl group in amoxicillin.'
    - Penicillin V is relatively stable to gastric acid. Amoxicillin and ampicillin, which carry the side-chain amino group,
      brought improved activity against Gram-negative bacteria.
    sources:
    - citation: ChEBI. penicillin (CHEBI:17334)
      url: https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:17334
      licence: CC BY 4.0
    - citation: ChEBI. phenoxymethylpenicillin (CHEBI:27446)
      url: https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:27446
      licence: CC BY 4.0
    - citation: ChEBI. amoxicillin (CHEBI:2676)
      url: https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:2676
      licence: CC BY 4.0
    - citation: 'Rawson TM, Wilson RC, Moore LSP, et al. Exploring the pharmacokinetics of phenoxymethylpenicillin (penicillin-V)
        in adults: a healthy volunteer study. Open Forum Infect Dis 2021;8(12):ofab573'
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8684501/
      licence: CC BY-NC-ND 4.0
    - citation: 'Bush K, Bradford PA. β-Lactams and β-lactamase inhibitors: an overview. Cold Spring Harb Perspect Med 2016;6(8):a025247'
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4968164/

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, checks, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Privacy (no personal data in the repo or in requests)
        run: node scripts/check-privacy.mjs
      - name: House rules (no tool attribution, no em dashes)
        run: node scripts/check-house-rules.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Build-size budget
        run: node scripts/check-size.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (offline, tooltips, tour, keyboard, axe)
        run: npx playwright test
      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
